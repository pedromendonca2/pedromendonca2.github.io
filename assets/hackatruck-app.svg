  </defs>
  <rect width="900" height="700" rx="36" fill="url(#background)"/>
  <circle cx="130" cy="120" r="180" fill="#74d8ff" opacity=".16"/>
  <circle cx="770" cy="580" r="230" fill="#b879ff" opacity=".18"/>
