<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" role="img" aria-labelledby="title desc">
  <title id="title">Prévia do website institucional da TOV Adv</title>
  <desc id="desc">Página inicial de um escritório de advocacia com navegação, chamada principal e áreas de atuação.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf1"/>
      <stop offset="1" stop-color="#e8dccb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#26180e" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="900" height="700" rx="36" fill="#2b1d15"/>
  <circle cx="760" cy="80" r="220" fill="#d7a866" opacity=".16"/>
  <circle cx="90" cy="630" r="240" fill="#a76b3d" opacity=".2"/>
  <g filter="url(#shadow)" transform="translate(74 106)">
    <rect width="752" height="486" rx="12" fill="url(#paper)"/>
    <rect width="752" height="52" rx="12" fill="#f3e8d8"/>
    <circle cx="28" cy="26" r="6" fill="#c99562"/>
    <circle cx="48" cy="26" r="6" fill="#c99562" opacity=".6"/>
    <circle cx="68" cy="26" r="6" fill="#c99562" opacity=".35"/>
