      <text x="480" y="104">ESCRITÓRIO</text><text x="575" y="104">ATUAÇÃO</text><text x="672" y="104">CONTATO</text>
    </g>
    <path d="M44 132H708" stroke="#d9c7b1"/>
    <text x="44" y="213" fill="#4a2d1f" font-family="Georgia, serif" font-size="42" font-weight="700">Direito com clareza,</text>
    <text x="44" y="260" fill="#a66d43" font-family="Georgia, serif" font-size="42" font-style="italic">estratégia e presença.</text>
    <text x="44" y="300" fill="#765844" font-family="Arial, sans-serif" font-size="13">Soluções jurídicas construídas para cada história.</text>
